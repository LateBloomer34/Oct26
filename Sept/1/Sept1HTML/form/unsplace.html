<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unsplace</title>
</head>
<body>
    <h1>Join unsplace</h1>
    <p>already have an account <a href="https:// www.google.com">login</a></p>


    <div>
        <form action="" >

            <label for="fname">First name</label>
            <input id="fname" required  type="text" name="firstName" pattern="[a-zA-Z]+">

            <label for="lName">last name </label>
            <input type="text" id="lName" name="lastName" pattern="[a-zA-Z]+">


            <label for="mail">email</label>
            <input type="email" id="mail" name="email" required >


            <label for="username">username</label>
            <input type="text" name="username" id="username" >

            <label for="password">password</label>
            <input type="password" name="password" id="password" pattern="[a-zA-Z0-9_]+">

            <input type="checkbox" name="" id="Scheckbox">
            <label for="Scheckbox">i'm not a robot</label>
            <input type="submit" value="Join">

        </form>
    </div>
</body>
</html>
