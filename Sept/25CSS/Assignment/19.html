<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Style an HTML table with borders, spacing, alternating row colors, and hover effects.</title>
    <link rel="stylesheet" href="19.css">
</head>
<body>
    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled Table</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>City</th>
                <th>Course</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Rahul</td>
                <td>22</td>
                <td>Delhi</td>
                <td>Web Development</td>
            </tr>

            <tr>
                <td>Aman</td>
                <td>24</td>
                <td>Mumbai</td>
                <td>JavaScript</td>
            </tr>

            <tr>
                <td>Priya</td>
                <td>21</td>
                <td>Jaipur</td>
                <td>CSS</td>
            </tr>

            <tr>
                <td>Neha</td>
                <td>23</td>
                <td>Dehradun</td>
                <td>HTML</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
