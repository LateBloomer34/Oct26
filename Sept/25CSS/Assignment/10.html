<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Style ordered and unordered lists using list-style properties.</title>
    <link rel="stylesheet" href="10.css">
</head>
<body>
    <ol type="A">
        <li>ram</li>
        <li>name</li>
        <li>kaam</li>
        <li>shyam</li>
    </ol>

    <ul>
        <li>ram</li>
        <li>name</li>
        <li>kaam</li>
        <li>shyam</li>
    </ul>
</body>
</html>
